kind = "web"
previewPath = "/"
title = "Connect Sphere"
description = "The official Huskagent Technology Company website for Connect Sphere, featuring the LaneuCap DAW, plugin catalogue, learning centre, release information, news, and customer support."
version = "1.0.0"
id = "artifacts/connect-sphere"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26236

[services.development]
run = "pnpm --filter @workspace/connect-sphere run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/connect-sphere", "run", "build" ]
serve = "static"
publicDir = "artifacts/connect-sphere/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26236"
BASE_PATH = "/"
